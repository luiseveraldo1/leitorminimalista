<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura Guiada - Leitor Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- SDKs do Firebase (Versão Compatível) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #f0f4f8; 
            --card-bg-color: #ffffff; 
            --text-color: #1e293b;
            --heading-color: #0f172a; 
            --primary-color: #2563eb; 
            --primary-hover-color: #1d4ed8;
            --secondary-color: #64748b; 
            --border-color: #cbd5e1; 
            --shadow-color: rgba(15, 23, 42, 0.06);
            --accent-glow: rgba(37, 99, 235, 0.15);
            --success-color: #059669; 
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --border-radius: 12px; 
            --card-padding: 22px;
        }
        
        body.dark-mode {
            --bg-color: #0b1320; 
            --card-bg-color: #152238; 
            --text-color: #e2e8f0;
            --heading-color: #f8fafc; 
            --primary-color: #3b82f6;
            --primary-hover-color: #60a5fa;
            --secondary-color: #94a3b8; 
            --border-color: #233554; 
            --shadow-color: rgba(0, 0, 0, 0.3);
            --accent-glow: rgba(59, 130, 246, 0.25);
        }

        body { 
            font-family: var(--font-family); 
            background: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 24px; 
            display: flex; 
            justify-content: center; 
            transition: background 0.25s ease, color 0.25s ease; 
        }

        .container { 
            width: 100%; 
            max-width: 1350px; 
            display: grid; 
            grid-template-columns: 380px 1fr; 
            gap: 24px; 
        }

        header { 
            grid-column: 1 / -1; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 5px;
        }

        header h1 { 
            color: var(--heading-color); 
            margin: 0; 
            font-size: 1.8rem; 
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header h1 span { color: var(--primary-color); }

        .controls-column { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        .card { 
            background: var(--card-bg-color); 
            border-radius: var(--border-radius); 
            padding: var(--card-padding); 
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px var(--shadow-color); 
            transition: all 0.2s ease; 
        }

        .card h3 { 
            margin: 0 0 14px 0; 
            color: var(--heading-color); 
            font-size: 1rem; 
            font-weight: 600;
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 8px; 
        }

        textarea, input[type="text"], input[type="number"], select { 
            width: 100%; 
            padding: 10px 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            font-size: 14px; 
            font-family: inherit;
            background: var(--bg-color); 
            color: var(--text-color); 
            box-sizing: border-box; 
            margin-bottom: 10px; 
        }

        textarea:focus, input:focus, select:focus { 
            outline: none; 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 3px var(--accent-glow); 
        }

        #rawText { height: 110px; resize: vertical; }
        #processedText { height: 130px; resize: vertical; margin-top: 10px;}

        .button-group { display: flex; flex-wrap: wrap; gap: 8px; }

        button { 
            background-color: var(--primary-color); 
            color: #ffffff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 500; 
            padding: 9px 14px; 
            font-size: 14px; 
            font-family: inherit; 
            transition: all 0.2s ease; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 6px; 
        }

        button:hover { background-color: var(--primary-hover-color); transform: translateY(-1px); }
        button.secondary { background-color: var(--secondary-color); }
        button.success { background-color: var(--success-color); }

        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; color: var(--secondary-color); } 
        .config-group { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; } 
        .config-group label { margin-bottom: 0; color: var(--text-color); } 
        .config-group input, .config-group select { margin-bottom: 0; }

        .reader-column { display: flex; flex-direction: column; gap: 20px; }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; } 
        .switch input { opacity: 0; width: 0; height: 0; } 
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: var(--secondary-color); transition: .3s; border-radius: 28px; 
        } 
        .slider:before { 
            position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; 
            background-color: white; transition: .3s; border-radius: 50%; 
        } 
        input:checked + .slider { background-color: var(--primary-color); } 
        input:checked + .slider:before { transform: translateX(22px); }

        #darkModeToggle:not(:checked) + .slider:after { content: '☀️'; position: absolute; top: 50%; right: 6px; transform: translateY(-50%); font-size: 12px; }
        #darkModeToggle:checked + .slider:after { content: '🌙'; position: absolute; top: 50%; left: 6px; transform: translateY(-50%); font-size: 12px; }
        #autoModeSwitch:checked + .slider { background-color: var(--success-color); }

        .reader-container { display: flex; gap: 20px; align-items: stretch; width: 100%; }
        
        .reader-container #output { 
            flex-grow: 1; 
            min-height: 380px; 
            padding: 45px 55px; 
            background: var(--card-bg-color); 
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px var(--shadow-color);
            font-size: 26px; 
            line-height: 1.7;
            color: var(--heading-color);
            display: flex; 
            align-items: center;
            text-align: left !important;
            overflow-wrap: break-word; 
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .controls-vertical {
            display: flex; flex-direction: column; gap: 12px; padding: 16px 12px; 
            background-color: var(--card-bg-color); border-radius: var(--border-radius);
            border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow-color);
            align-self: flex-start; flex-shrink: 0; 
        }
        
        .controls-vertical button {
            width: 44px; height: 44px; font-size: 1.2em; border-radius: 50%; 
            background-color: var(--primary-color); color: white; padding: 0; 
            display: flex; align-items: center; justify-content: center;
        }
        .controls-vertical button:hover { background-color: var(--primary-hover-color); transform: scale(1.08); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background-color: var(--card-bg-color); border-radius: var(--border-radius);
            border: 1px solid var(--border-color); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            max-width: 750px; width: 90%; display: flex; flex-direction: column; max-height: 85vh;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid var(--border-color);
        }
        .modal-header h3 { margin: 0; color: var(--heading-color); }
        .modal-close-btn { background: none; border: none; font-size: 1.4em; cursor: pointer; color: var(--secondary-color); }
        .editor-list { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .editor-item {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
            padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px;
            background-color: var(--bg-color);
        }
        .editor-item p { flex-grow: 1; margin: 0; padding: 4px; outline: none; color: var(--text-color); }
        .editor-footer { padding: 16px 20px; border-top: 1px solid var(--border-color); text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Leitura <span>Guiada</span></h1>
            <label class="switch" title="Alternar Modo Escuro">
                <input type="checkbox" id="darkModeToggle">
                <span class="slider"></span>
            </label>
        </header>

        <aside class="controls-column">
            <div class="card">
                <h3>1. Entrada de Texto <span id="rawTextCounter" style="font-size: 0.75rem; font-weight: 400; color: var(--secondary-color);"></span></h3>
                <textarea id="rawText" rows="6" placeholder="Cole seu texto aqui..." oninput="updateCounters()"></textarea>
                <div class="button-group">
                    <button onclick="pasteFromClipboard()">📋 Colar</button>
                    <button onclick="openManualEditor()">✂️ Editar</button>
                    <button onclick="clearRawText()" class="secondary">🗑️ Limpar</button>
                </div>
				
                <div style="margin-top: 14px;">
                    <label for="summaryPercent">Proporção do Resumo (% de frases)</label>
                    <input type="number" id="summaryPercent" value="25" min="5" max="80" step="5">
                </div>
                <button onclick="generateSentences()" style="width: 100%; margin-top: 6px;">📝 Resumir Texto</button>
            </div>

            <div class="card">
                <h3>2. Leitura Processada <span id="processedTextCounter" style="font-size: 0.75rem; font-weight: 400; color: var(--secondary-color);"></span></h3>
                <textarea id="processedText" placeholder="As frases extraídas aparecerão aqui." oninput="updateCounters()"></textarea>
                <button onclick="syncProcessedText()" style="width: 100%;">🔄 Sincronizar Edições</button>
            </div>

            <div class="card">
                <h3>⚙️ Visualização e Voz</h3>
                <label for="voiceSelect">Voz Selecionada</label>
                <select id="voiceSelect"></select>

                <div class="config-group" style="margin-top: 10px; margin-bottom: 15px;">
                    <label style="font-weight: 600;">Modo Automático:</label>
                    <label class="switch" style="margin-left: auto;">
                         <input type="checkbox" id="autoModeSwitch" onclick="toggleAutoMode()">
                         <span class="slider"></span>
                    </label>
                </div>

                <div class="config-group">
                    <label>Velocidade: <input type="number" id="voiceRate" value="1" min="0.1" max="3" step="0.1"></label>
                    <label>Tamanho: <input type="number" id="fontSize" value="26" min="14" max="60"></label>
                </div>

                <div class="config-group">
                    <label for="fontColor">Cor da Fonte:</label>
                    <input type="color" id="fontColor" value="#0f172a">
                </div>

                <label for="fontFamily">Tipografia</label>
                <select id="fontFamily">
                  <option value="Inter, sans-serif">Inter (Recomendada)</option>
                  <option value="Roboto Mono, monospace">Roboto Mono</option>
                  <option value="Georgia, serif">Georgia</option>
                  <option value="Arial, sans-serif">Arial</option>
                </select>
            </div>

            <div class="card">
                <h3>💾 Vincular ao Tópico Atual</h3>
                <p id="statusVinculo" style="font-size: 13px; color: var(--secondary-color); margin-bottom: 10px;">Carregando dados do tópico...</p>

                <label for="rotuloLinkInput">Rótulo do Link:</label>
                <input type="text" id="rotuloLinkInput" value="Leitura Guiada" placeholder="Ex: Leitura Guiada - Aula 1">

                <button onclick="salvarVinculoFirebase()" class="success" style="width: 100%;">🔥 Salvar e Enviar para o Alumno</button>

                <div class="button-group" style="margin-top: 10px;">
                    <button onclick="exportJSON()" class="secondary" style="flex: 1;">📥 JSON</button>
                    <label for="importFile" class="button secondary" style="cursor:pointer; margin: 0; flex: 1; text-align: center;">📤 Importar</label>
                    <input type="file" id="importFile" onchange="importJSON(event)" style="display:none;">
                </div>
            </div>
        </aside>

        <main class="reader-column">
            <div class="reader-container">
                <div id="output">Bem-vindo ao Leitura Guiada! Cole um texto e clique em Resumir.</div>
                <div class="controls-vertical">
                    <button id="playPauseBtn" onclick="playPauseToggle()" title="Play/Pause">▶️</button>
                    <button id="stopBtn" onclick="stopReading()" title="Parar">⏹️</button>
                    <button id="nextBtn" onclick="nextSentence()" title="Próxima">⏭️</button>
                    <button id="prevBtn" onclick="prevSentence()" title="Anterior">⏮️</button>
                    <button id="voiceToggleBtn" onclick="toggleVoice()" title="Voz On/Off">🗣️</button>
                </div>
            </div>	
			
            <div class="card">
                 <h3>Pesquisa Rápida</h3>
                 <div style="display: flex; gap: 10px; align-items: center;">
                     <input type="text" id="searchInput" placeholder="Pesquisar termo..." style="margin-bottom:0;">
                     <button onclick="searchGoogle()">🔍</button>
                 </div>
            </div>
        </main>
    </div>

    <!-- Modal do Editor Manual -->
    <div id="manual-editor-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editor de Períodos e Parágrafos</h3>
                <button class="modal-close-btn" onclick="closeManualEditor()">&times;</button>
            </div>
            <div id="editor-list" class="editor-list"></div>
            <div class="editor-footer">
                <button class="success" onclick="saveManualChanges()">✓ Salvar Alterações</button>
            </div>
        </div>
    </div>

<script>
// =======================================================
// FIREBASE CONFIG
// =======================================================
const firebaseConfig = {
  apiKey: "AIzaSyCkkY-jMqHAulldhSCHf7LF3Bc45DzXL1w",
  authDomain: "estudante-7b878.firebaseapp.com",
  projectId: "estudante-7b878",
  storageBucket: "estudante-7b878.firebasestorage.app",
  messagingSenderId: "160273673549",
  appId: "1:160273673549:web:4ef24ef1c57fd87f5b5b04",
  measurementId: "G-Z2YK4X5V9E"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

// Parâmetros recebidos da URL do Alumno
const urlParams = new URLSearchParams(window.location.search);
const userIdUrl = urlParams.get('userId') || urlParams.get('alumnoId'); // Compatibilidade com UID do users
const topicoIdUrl = urlParams.get('topicoId');
const leituraIdParam = urlParams.get('id');

document.addEventListener('DOMContentLoaded', () => {
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;
    const fontColorInput = document.getElementById('fontColor');
    
    function applyTheme(isDark) {
        if (isDark) {
            body.classList.add('dark-mode');
            if (fontColorInput.value === '#0f172a') fontColorInput.value = '#f8fafc';
        } else {
            body.classList.remove('dark-mode');
            if (fontColorInput.value === '#f8fafc') fontColorInput.value = '#0f172a';
        }
    }

    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if(darkModeToggle) {
        darkModeToggle.checked = prefersDark;
        applyTheme(prefersDark);
        darkModeToggle.addEventListener('change', () => applyTheme(darkModeToggle.checked));
    }

    loadVoices();
    verificarContextoUrl();

    if (leituraIdParam) {
        carregarLeituraFirebasePorUrl(leituraIdParam);
    } else {
        document.getElementById('rawText').value = `O rover Curiosity, da NASA, pousou em Marte em 2012 para investigar o passado geológico do planeta.\n\nA missão do Curiosity é determinar se Marte já teve as condições ambientais necessárias para sustentar vida microbiana.`;
    }
    updateCounters();
    document.getElementById('autoModeSwitch').checked = autoMode;
});

function verificarContextoUrl() {
    const statusEl = document.getElementById('statusVinculo');
    if (userIdUrl && topicoIdUrl) {
        statusEl.innerHTML = "✅ Conectado ao usuário e tópico com sucesso!";
        statusEl.style.color = "var(--success-color)";
    } else {
        statusEl.innerHTML = "⚠️ Aberto de forma avulsa (Parâmetros incompletos na URL).";
        statusEl.style.color = "#d97706";
    }
}

// =======================================================
// VARIÁVEIS GLOBAIS DE LEITURA
// =======================================================
let sentences=[], currentIndex=0, autoMode=false, voiceEnabled=true;
let voices=[], selectedVoice=null;
const output=document.getElementById('output');
const voiceSelect=document.getElementById('voiceSelect');
const rawTextArea = document.getElementById('rawText');

function sent_tokenize_browser(text) {
    return text.match(/[^.!?]+[.!?]+/g) || [text.trim()];
}

function gerarResumo(textoOriginal) {
    const frases = sent_tokenize_browser(textoOriginal.trim());
    const totalFrases = frases.length;
    const percentual = document.getElementById('summaryPercent')?.value || 25;
    let numFrasesDesejadas = Math.max(1, Math.ceil(totalFrases * (percentual / 100)));
    if (totalFrases === 0) return "Texto muito curto.";
    
    return frases.slice(0, numFrasesDesejadas).join(' ');
}

function loadVoices(){
    const allVoices = speechSynthesis.getVoices();
    if(!voiceSelect) return;
    voiceSelect.innerHTML = ""; 
    voices = allVoices.filter(v => v.lang.startsWith('pt-'));

    let defaultOption = document.createElement("option");
    defaultOption.value = -1;
    defaultOption.textContent = "Automático (Padrão)";
    voiceSelect.appendChild(defaultOption);

    voices.forEach((v, i) => {
        let o = document.createElement("option");
        o.value = i;
        o.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(o);
    });

    if(voices.length > 0) { selectedVoice = voices[0]; voiceSelect.value = 0; }
}
speechSynthesis.onvoiceschanged = loadVoices;
voiceSelect.addEventListener("change", () => {
    const index = parseInt(voiceSelect.value);
    selectedVoice = (index === -1) ? null : voices[index];
});

function generateSentences(){
    stopReading();
    const text = document.getElementById('rawText').value;
    if(!text.trim()) return;
    const resumoText = gerarResumo(text);
    document.getElementById('processedText').value = resumoText;
    sentences = resumoText.split(/\n\s*\n/).flatMap(p => sent_tokenize_browser(p)).map(s=>s.trim()).filter(Boolean);
    currentIndex = 0;
    showCurrent();
    updateCounters();
}

function syncProcessedText(){
    stopReading();
    sentences = document.getElementById('processedText').value.split(/\n\s*\n/).flatMap(p => sent_tokenize_browser(p)).map(s=>s.trim()).filter(Boolean);
    currentIndex = 0;
    showCurrent();
    updateCounters();
}

function clearRawText(){
    stopReading();
    document.getElementById('rawText').value = "";
    document.getElementById('processedText').value = "";
    sentences = [];
    output.textContent = "Texto apagado.";
    updateCounters();
}

function searchGoogle(){ 
    const q = document.getElementById('searchInput').value.trim(); 
    if(q) window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, "_blank"); 
}

function showCurrent(){
    if(!sentences || !sentences.length){ output.textContent = "Nenhuma frase gerada."; return; }
    output.style.fontSize = (document.getElementById('fontSize')?.value || 26) + "px";
    output.style.color = document.getElementById('fontColor')?.value || '#0f172a';
    output.style.fontFamily = document.getElementById('fontFamily')?.value || 'Inter, sans-serif';
    output.textContent = sentences[currentIndex];
}

function speakCurrent() {
    const text = sentences[currentIndex];
    if (!voiceEnabled || !text || !text.trim()) { if (autoMode) nextSentenceAuto(); return; }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (selectedVoice) utter.voice = selectedVoice;
    utter.rate = parseFloat(document.getElementById('voiceRate')?.value) || 1;
    
    utter.onend = () => { if (autoMode) setTimeout(nextSentenceAuto, 250); else document.getElementById('playPauseBtn').textContent = '▶️'; };
    speechSynthesis.speak(utter);
}

function playPauseToggle() {
    if (!sentences.length) { alert("Resuma o texto primeiro!"); return; }
    if (speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); document.getElementById('playPauseBtn').textContent = '▶️'; }
    else if (speechSynthesis.paused) { speechSynthesis.resume(); document.getElementById('playPauseBtn').textContent = '⏸️'; }
    else { if (currentIndex < 0 || currentIndex >= sentences.length) currentIndex = 0; showCurrent(); speakCurrent(); }
}

function stopReading() {
    autoMode = false;
    document.getElementById('autoModeSwitch').checked = false;
    speechSynthesis.cancel();
    document.getElementById('playPauseBtn').textContent = '▶️';
}

function toggleAutoMode() {
    autoMode = document.getElementById('autoModeSwitch').checked;
    if (autoMode && !speechSynthesis.speaking) { showCurrent(); speakCurrent(); }
    else speechSynthesis.cancel();
}

function nextSentenceAuto(){
    if (!sentences.length || !autoMode) { stopReading(); return; }
    currentIndex = (currentIndex + 1) % sentences.length;
    showCurrent();
    speakCurrent();
}

function nextSentence(){ if (!sentences.length) return; stopReading(); currentIndex = (currentIndex + 1) % sentences.length; showCurrent(); if(voiceEnabled) speakCurrent(); }
function prevSentence(){ if (!sentences.length) return; stopReading(); currentIndex = (currentIndex - 1 + sentences.length) % sentences.length; showCurrent(); if(voiceEnabled) speakCurrent(); }
function toggleVoice(){ voiceEnabled = !voiceEnabled; document.getElementById('voiceToggleBtn').textContent = voiceEnabled ? '🗣️' : '🔇'; if (!voiceEnabled) speechSynthesis.cancel(); }

function exportJSON(){ 
    const data = { sentences }; 
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); 
    const url = URL.createObjectURL(blob); 
    const a = document.createElement('a'); a.href = url; a.download = 'leitura_guiada.json'; a.click(); 
}

function importJSON(event){ 
    const file = event.target.files[0]; 
    if(!file) return; 
    const reader = new FileReader(); 
    reader.onload = (e) => { 
        try { 
            const data = JSON.parse(e.target.result); 
            if(data.sentences) sentences = data.sentences; 
            document.getElementById('processedText').value = sentences.join("\n\n"); 
            showCurrent(); alert("Importado com sucesso!"); 
        } catch(err) { alert("Erro: " + err); } 
    }; 
    reader.readAsText(file); 
}

// ===============================================
// SALVAMENTO AUTOMATIZADO VIA PONTE (FIRESTORE)
// ===============================================
async function salvarVinculoFirebase() {
    if (!userIdUrl || !topicoIdUrl) {
        alert("Erro: Parâmetros do usuário ou tópico ausentes na URL.");
        return;
    }

    if (!sentences || !sentences.length) {
        alert("Resuma ou processe o texto antes de salvar!");
        return;
    }

    const rotulo = document.getElementById('rotuloLinkInput').value.trim() || "Leitura Guiada";

    try {
        // 1. Salva o conteúdo completo na coleção isolada 'leituras_guiadas'
        const leituraRef = await firebase.firestore().collection('leituras_guiadas').add({
            rawText: document.getElementById('rawText').value,
            processedText: document.getElementById('processedText').value,
            sentences: sentences,
            criadoEm: new Date().toISOString()
        });
        
        const leituraId = leituraRef.id;
        const urlAcesso = `${window.location.origin}${window.location.pathname}?id=${leituraId}`;

        // 2. Cria a ponte atualizando diretamente a árvore do usuário na coleção 'users'
        const userDocRef = firebase.firestore().collection('users').doc(userIdUrl);
        
        const novoLink = {
            id: leituraId,
            title: rotulo, // Atualizado para usar 'title' para compatibilidade perfeita com o Alumno
            url: urlAcesso,
            tipo: 'Web',
            criadoEm: new Date().toISOString()
        };

        // Buscamos o documento atual do usuário para mesclar com segurança no studyPlan
        const userSnap = await userDocRef.get();
        let updateData = {};

        if (userSnap.exists) {
            const userData = userSnap.data();
            const studyPlan = userData.studyPlan || {};
            
            if (studyPlan[topicoIdUrl]) {
                if (!studyPlan[topicoIdUrl].links) {
                    studyPlan[topicoIdUrl].links = [];
                }
                studyPlan[topicoIdUrl].links.push(novoLink);
            } else {
                // Caso o tópico ainda não exista na árvore, inicializa estruturado
                studyPlan[topicoIdUrl] = {
                    links: [novoLink]
                };
            }
            updateData.studyPlan = studyPlan;
        } else {
            // Caso o doc do usuário não exista ainda, cria a estrutura base
            updateData.studyPlan = {
                [topicoIdUrl]: {
                    links: [novoLink]
                }
            };
        }

        await userDocRef.set(updateData, { merge: true });

        alert("Link salvo com sucesso e integrado ao seu perfil no Alumno!");
        
    } catch (error) {
        console.error("Erro ao salvar no Firestore:", error.code, error.message);
        alert("Erro ao salvar: " + error.message);
    }
}

async function carregarLeituraFirebasePorUrl(id) {
    try {
        const docRef = await firebase.firestore().collection('leituras_guiadas').doc(id).get();
        if (docRef.exists) {
            const data = docRef.data();
            if (data && data.sentences) {
                sentences = data.sentences;
                currentIndex = 0;
                if (data.rawText) document.getElementById('rawText').value = data.rawText;
                if (data.processedText) document.getElementById('processedText').value = data.processedText;
                showCurrent();
                updateCounters();
            }
        }
    } catch(err) {
        console.error("Erro ao carregar leitura do Firestore:", err);
    }
}

// =======================================================
// EDITOR MANUAL
// =======================================================
function openManualEditor() {
    const editorList = document.getElementById('editor-list');
    const text = rawTextArea.value;
    if (!text.trim()) { alert('Caixa vazia.'); return; }
    const periods = text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    editorList.innerHTML = '';
    
    periods.forEach(period => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'editor-item';
        itemDiv.innerHTML = `<p contenteditable="true">${period}</p><button class="secondary" onclick="this.parentElement.remove()" style="border-radius:50%; width:28px; height:28px; padding:0;">&times;</button>`;
        editorList.appendChild(itemDiv);
    });
    document.getElementById('manual-editor-modal').style.display = 'flex';
}

function closeManualEditor() { document.getElementById('manual-editor-modal').style.display = 'none'; }

function saveManualChanges() {
    const items = document.querySelectorAll('#editor-list p');
    let newText = [];
    items.forEach(item => { if (item.textContent.trim()) newText.push(item.textContent.trim()); });
    rawTextArea.value = newText.join('\n\n');
    closeManualEditor();
    updateCounters();
}

function updateCounters() {
    const rawText = document.getElementById('rawText').value;
    const processedText = document.getElementById('processedText').value;
    document.getElementById('rawTextCounter').textContent = `(${rawText.length} carac.)`;
    document.getElementById('processedTextCounter').textContent = `(${processedText.length} carac.)`;
}
</script>
