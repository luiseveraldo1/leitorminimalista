<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura Guiada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* ================= SKIN: MINIMALISTA (Padrão) ================= */
        :root, body.skin-minimalista {
            --bg-color: #f8fafc; 
            --card-bg-color: #ffffff; 
            --text-color: #1e293b;
            --heading-color: #0f172a; 
            --primary-color: #2563eb; 
            --primary-hover-color: #1d4ed8;
            --secondary-color: #64748b; 
            --border-color: #e2e8f0; 
            --shadow-color: rgba(15, 23, 42, 0.04);
            --accent-glow: rgba(37, 99, 235, 0.12);
            --success-color: #059669; 
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --border-radius: 10px; 
            --card-padding: 16px;
        }

        body.dark-mode.skin-minimalista {
            --bg-color: #0b1320; 
            --card-bg-color: #111c2e; 
            --text-color: #cbd5e1;
            --heading-color: #f8fafc; 
            --primary-color: #3b82f6;
            --primary-hover-color: #60a5fa;
            --secondary-color: #94a3b8; 
            --border-color: #1e293b; 
            --shadow-color: rgba(0, 0, 0, 0.2);
            --accent-glow: rgba(59, 130, 246, 0.2);
        }

        /* ================= SKIN: MODERNA ================= */
        body.skin-moderna {
            --bg-color: #f1f5f9;
            --card-bg-color: #ffffff;
            --text-color: #334155;
            --heading-color: #0f172a;
            --primary-color: #6366f1;
            --primary-hover-color: #4f46e5;
            --secondary-color: #64748b;
            --border-color: #cbd5e1;
            --shadow-color: rgba(99, 102, 241, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.2);
            --success-color: #10b981;
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --border-radius: 16px;
            --card-padding: 20px;
        }
        body.dark-mode.skin-moderna {
            --bg-color: #0f172a;
            --card-bg-color: #1e293b;
            --text-color: #cbd5e1;
            --heading-color: #f8fafc;
            --primary-color: #818cf8;
            --primary-hover-color: #6366f1;
            --secondary-color: #94a3b8;
            --border-color: #334155;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --accent-glow: rgba(129, 140, 248, 0.3);
        }

        /* ================= SKIN: FUTURÍSTICA ================= */
        body.skin-futuristica {
            --bg-color: #030712;
            --card-bg-color: #0b0f19;
            --text-color: #9ca3af;
            --heading-color: #38bdf8;
            --primary-color: #0ea5e9;
            --primary-hover-color: #0284c7;
            --secondary-color: #4b5563;
            --border-color: #1e293b;
            --shadow-color: rgba(14, 165, 233, 0.15);
            --accent-glow: rgba(14, 165, 233, 0.4);
            --success-color: #22c55e;
            --font-family: 'Orbitron', sans-serif;
            --border-radius: 4px;
            --card-padding: 16px;
        }

        /* ================= SKIN: TECNOLÓGICA ================= */
        body.skin-tecnologica {
            --bg-color: #0d1117;
            --card-bg-color: #161b22;
            --text-color: #c9d1d9;
            --heading-color: #58a6ff;
            --primary-color: #238636;
            --primary-hover-color: #2ea043;
            --secondary-color: #8b949e;
            --border-color: #30363d;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --accent-glow: rgba(35, 134, 54, 0.3);
            --success-color: #2ea043;
            --font-family: 'Roboto Mono', monospace;
            --border-radius: 6px;
            --card-padding: 16px;
        }

        /* ================= SKIN: PINK GIRL ================= */
        body.skin-pinkgirl {
            --bg-color: #fff1f2;
            --card-bg-color: #ffffff;
            --text-color: #4c0519;
            --heading-color: #9f1239;
            --primary-color: #e11d48;
            --primary-hover-color: #be123c;
            --secondary-color: #9f1239;
            --border-color: #fecdd3;
            --shadow-color: rgba(225, 29, 72, 0.08);
            --accent-glow: rgba(225, 29, 72, 0.2);
            --success-color: #db2777;
            --font-family: 'Inter', sans-serif;
            --border-radius: 20px;
            --card-padding: 18px;
        }
        body.dark-mode.skin-pinkgirl {
            --bg-color: #1c050a;
            --card-bg-color: #2c0b14;
            --text-color: #fbcfe8;
            --heading-color: #fda4af;
            --primary-color: #f43f5e;
            --primary-hover-color: #e11d48;
            --secondary-color: #fda4af;
            --border-color: #4c0519;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --accent-glow: rgba(244, 63, 94, 0.3);
        }

        /* ================= SKIN: MUSICAL ================= */
        body.skin-musical {
            --bg-color: #121212;
            --card-bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --heading-color: #1ed760;
            --primary-color: #1ed760;
            --primary-hover-color: #1aa34a;
            --secondary-color: #b3b3b3;
            --border-color: #2c2c2c;
            --shadow-color: rgba(30, 215, 96, 0.1);
            --accent-glow: rgba(30, 215, 96, 0.3);
            --success-color: #1ed760;
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --border-radius: 12px;
            --card-padding: 16px;
        }

        body { 
            font-family: var(--font-family); 
            background: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 16px; 
            display: flex; 
            justify-content: center; 
            transition: background 0.2s ease, color 0.2s ease; 
        }

        .container { 
            width: 100%; 
            max-width: 1280px; 
            display: grid; 
            grid-template-columns: 340px 1fr; 
            gap: 16px; 
        }

        header { 
            grid-column: 1 / -1; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2px;
        }

        header h1 { 
            color: var(--heading-color); 
            margin: 0; 
            font-size: 1.4rem; 
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header h1 span { color: var(--primary-color); }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-column { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .card { 
            background: var(--card-bg-color); 
            border-radius: var(--border-radius); 
            padding: var(--card-padding); 
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px var(--shadow-color); 
        }

        .card h3 { 
            margin: 0 0 10px 0; 
            color: var(--heading-color); 
            font-size: 0.9rem; 
            font-weight: 600;
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 6px; 
        }

        textarea, input[type="text"], input[type="number"], select { 
            width: 100%; 
            padding: 8px 10px; 
            border-radius: var(--border-radius); 
            border: 1px solid var(--border-color); 
            font-size: 13px; 
            font-family: inherit;
            background: var(--bg-color); 
            color: var(--text-color); 
            box-sizing: border-box; 
            margin-bottom: 8px; 
        }

        textarea:focus, input:focus, select:focus { 
            outline: none; 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 2px var(--accent-glow); 
        }

        #rawText { height: 90px; resize: vertical; }
        #processedText { height: 110px; resize: vertical; margin-top: 8px;}

        .button-group { display: flex; flex-wrap: wrap; gap: 6px; }

        button { 
            background-color: var(--primary-color); 
            color: #ffffff; 
            border: none; 
            border-radius: var(--border-radius); 
            cursor: pointer; 
            font-weight: 500; 
            padding: 7px 12px; 
            font-size: 13px; 
            font-family: inherit; 
            transition: all 0.15s ease; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 5px; 
        }

        button:hover { background-color: var(--primary-hover-color); }
        button.secondary { background-color: var(--secondary-color); color: #ffffff; }
        button.success { background-color: var(--success-color); color: #ffffff; }

        label { display: block; margin-bottom: 3px; font-weight: 500; font-size: 12px; color: var(--secondary-color); } 
        .config-group { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; } 
        .config-group label { margin-bottom: 0; color: var(--text-color); } 
        .config-group input, .config-group select { margin-bottom: 0; }

        .reader-column { display: flex; flex-direction: column; gap: 12px; }
        
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; } 
        .switch input { opacity: 0; width: 0; height: 0; } 
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: var(--secondary-color); transition: .2s; border-radius: 22px; 
        } 
        .slider:before { 
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; 
            background-color: white; transition: .2s; border-radius: 50%; 
        } 
        input:checked + .slider { background-color: var(--primary-color); } 
        input:checked + .slider:before { transform: translateX(18px); }

        #darkModeToggle:not(:checked) + .slider:after { content: '☀️'; position: absolute; top: 50%; right: 4px; transform: translateY(-50%); font-size: 10px; }
        #darkModeToggle:checked + .slider:after { content: '🌙'; position: absolute; top: 50%; left: 4px; transform: translateY(-50%); font-size: 10px; }
        #autoModeSwitch:checked + .slider { background-color: var(--success-color); }

        .reader-container { display: flex; gap: 16px; align-items: stretch; width: 100%; }
        
        .reader-container #output { 
            flex-grow: 1; 
            min-height: 340px; 
            padding: 35px 45px; 
            background: var(--card-bg-color); 
            border-radius: var(--border-radius);
            box-shadow: 0 2px 10px var(--shadow-color);
            font-size: 24px; 
            line-height: 1.6;
            color: var(--heading-color);
            display: flex; 
            align-items: center;
            text-align: left !important;
            overflow-wrap: break-word; 
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .controls-vertical {
            display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; 
            background-color: var(--card-bg-color); border-radius: var(--border-radius);
            border: 1px solid var(--border-color); box-shadow: 0 2px 8px var(--shadow-color);
            align-self: flex-start; flex-shrink: 0; 
        }
        
        .controls-vertical button {
            width: 40px; height: 40px; font-size: 1.1em; border-radius: 50%; 
            background-color: var(--primary-color); color: white; padding: 0; 
            display: flex; align-items: center; justify-content: center;
        }
        .controls-vertical button:hover { background-color: var(--primary-hover-color); transform: scale(1.05); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.5);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background-color: var(--card-bg-color); border-radius: var(--border-radius);
            border: 1px solid var(--border-color); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
            max-width: 700px; width: 90%; display: flex; flex-direction: column; max-height: 80vh;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid var(--border-color);
        }
        .modal-header h3 { margin: 0; color: var(--heading-color); font-size: 1rem; }
        .modal-close-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; color: var(--secondary-color); }
        .editor-list { padding: 16px; overflow-y: auto; flex-grow: 1; }
        .editor-item {
            display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
            padding: 6px 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius);
            background-color: var(--bg-color);
        }
        .editor-item p { flex-grow: 1; margin: 0; padding: 4px; outline: none; color: var(--text-color); font-size: 13px; }
        .editor-footer { padding: 12px 16px; border-top: 1px solid var(--border-color); text-align: right; }
    </style>
</head>
<body class="skin-minimalista">
    <div class="container">
        <header>
            <h1>Leitura <span>Guiada</span></h1>
            <div class="header-controls">
                <select id="skinSelector" onchange="changeSkin(this.value)" style="margin-bottom:0; width:auto; font-size:12px; padding:5px 8px;">
                    <option value="skin-minimalista">🎨 Minimalista</option>
                    <option value="skin-moderna">🎨 Moderna</option>
                    <option value="skin-futuristica">🎨 Futurística</option>
                    <option value="skin-tecnologica">🎨 Tecnológica</option>
                    <option value="skin-pinkgirl">🎨 Pink Girl</option>
                    <option value="skin-musical">🎨 Musical</option>
                </select>
                <label class="switch" title="Alternar Modo Escuro">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </header>

        <aside class="controls-column">
            <div class="card">
                <h3>1. Entrada de Texto <span id="rawTextCounter" style="font-size: 0.7rem; font-weight: 400; color: var(--secondary-color);"></span></h3>
                <textarea id="rawText" placeholder="Cole seu texto aqui..." oninput="updateCounters()"></textarea>
                <div class="button-group">
                    <button onclick="copyRawText()">📑 Copiar</button>
                    <button onclick="pasteFromClipboard()">📋 Colar</button>
                    <button onclick="openManualEditor()">✂️ Aparar Texto</button>
                    <button onclick="clearRawText()" class="secondary">🗑️ Limpar</button>
                </div>
				
                <div style="margin-top: 10px;">
                    <label for="summaryPercent">Proporção do Resumo (% de frases)</label>
                    <input type="number" id="summaryPercent" value="100" min="5" max="100" step="5">
                </div>
                <button onclick="generateSentences()" style="width: 100%; margin-top: 4px;">📝 Resumir Texto</button>
            </div>

            <div class="card">
                <h3>2. Prévia do Texto para Leitura <span id="processedTextCounter" style="font-size: 0.7rem; font-weight: 400; color: var(--secondary-color);"></span></h3>
                <textarea id="processedText" placeholder="As frases extraídas aparecerão aqui." oninput="updateCounters()"></textarea>
                <div class="button-group" style="margin-bottom: 8px;">
                    <button onclick="copyProcessedText()" style="flex: 1;">📑 Copiar</button>
                    <button onclick="pasteToProcessedText()" style="flex: 1;">📋 Colar</button>
                </div>
                <button onclick="syncProcessedText()" style="width: 100%;">🔄 Sincronizar Edições</button>
            </div>

            <div class="card">
                <h3>⚙️ Visualização e Voz</h3>
                <label for="voiceSelect">Voz Selecionada</label>
                <select id="voiceSelect"></select>

                <div class="config-group" style="margin-top: 8px; margin-bottom: 10px;">
                    <label style="font-weight: 600;">Modo Automático:</label>
                    <label class="switch" style="margin-left: auto;">
                         <input type="checkbox" id="autoModeSwitch" onclick="toggleAutoMode()">
                         <span class="slider"></span>
                    </label>
                </div>

                <div class="config-group">
                    <label>Velocidade: <input type="number" id="voiceRate" value="1" min="0.1" max="3" step="0.1"></label>
                    <label>Tamanho: <input type="number" id="fontSize" value="24" min="14" max="60"></label>
                </div>

                <div class="config-group">
                    <label for="fontColor">Cor da Fonte:</label>
                    <input type="color" id="fontColor" value="#0f172a">
                </div>

                <label for="fontFamily">Tipografia</label>
                <select id="fontFamily">
                  <option value="Inter, sans-serif">Inter (Recomendada)</option>
                  <option value="Roboto Mono, monospace">Roboto Mono</option>
                  <option value="Georgia, serif">Georgia</option>
                  <option value="Arial, sans-serif">Arial</option>
                </select>
            </div>

            <div class="card">
                <h3>💾 Vincular ao Tópico Atual</h3>
                <p id="statusVinculo" style="font-size: 12px; color: var(--secondary-color); margin-bottom: 8px;">Carregando dados do tópico...</p>

                <label for="rotuloLinkInput">Rótulo do Link:</label>
                <input type="text" id="rotuloLinkInput" value="Leitura Guiada" placeholder="Ex: Leitura Guiada - Aula 1">

                <button onclick="salvarVinculoFirebase()" class="success" style="width: 100%;">🔥 Salvar e Enviar para o Alumno</button>

                <div class="button-group" style="margin-top: 8px;">
                    <button onclick="exportJSON()" class="secondary" style="flex: 1;">📥 JSON</button>
                    <label for="importFile" class="button secondary" style="cursor:pointer; margin: 0; flex: 1; text-align: center;">📤 Importar</label>
                    <input type="file" id="importFile" onchange="importJSON(event)" style="display:none;">
                </div>
            </div>
        </aside>

        <main class="reader-column">
            <div class="reader-container">
                <div id="output">Bem-vindo ao Leitura Guiada! Cole um texto e clique em Resumir.</div>
                <div class="controls-vertical">
                    <button id="playPauseBtn" onclick="playPauseToggle()" title="Play/Pause">▶️</button>
                    <button id="stopBtn" onclick="stopReading()" title="Parar">⏹️</button>
                    <button id="nextBtn" onclick="nextSentence()" title="Próxima">⏭️</button>
                    <button id="prevBtn" onclick="prevSentence()" title="Anterior">⏮️</button>
                    <button id="voiceToggleBtn" onclick="toggleVoice()" title="Voz On/Off">🗣️</button>
                </div>
            </div>	
			
            <div class="card">
                 <h3>Pesquisa Rápida</h3>
                 <div style="display: flex; gap: 8px; align-items: center;">
                     <input type="text" id="searchInput" placeholder="Pesquisar termo..." style="margin-bottom:0;">
                     <button onclick="searchGoogle()">🔍</button>
                 </div>
            </div>
        </main>
    </div>

    <!-- Modal do Editor Manual (Aparar Texto) -->
    <div id="manual-editor-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Aparar Texto (Divisão por Frases)</h3>
                <button class="modal-close-btn" onclick="closeManualEditor()">&times;</button>
            </div>
            <div id="editor-list" class="editor-list"></div>
            <div class="editor-footer">
                <button class="success" onclick="saveManualChanges()">✓ Salvar Alterações</button>
            </div>
        </div>
    </div>

<script>
// =======================================================
// FIREBASE CONFIG
// =======================================================
const firebaseConfig = {
  apiKey: "AIzaSyCkkY-jMqHAulldhSCHf7LF3Bc45DzXL1w",
  authDomain: "estudante-7b878.firebaseapp.com",
  projectId: "estudante-7b878",
  storageBucket: "estudante-7b878.firebasestorage.app",
  messagingSenderId: "160273673549",
  appId: "1:160273673549:web:4ef24ef1c57fd87f5b5b04",
  measurementId: "G-Z2YK4X5V9E"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

// Parâmetros recebidos da URL do Alumno
const urlParams = new URLSearchParams(window.location.search);
const userIdUrl = urlParams.get('userId') || urlParams.get('alumnoId');
const topicoIdUrl = urlParams.get('topicoId');
const leituraIdParam = urlParams.get('id');

document.addEventListener('DOMContentLoaded', () => {
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;
    const fontColorInput = document.getElementById('fontColor');
    
    function applyTheme(isDark) {
        if (isDark) {
            body.classList.add('dark-mode');
            if (fontColorInput.value === '#0f172a') fontColorInput.value = '#f8fafc';
        } else {
            body.classList.remove('dark-mode');
            if (fontColorInput.value === '#f8fafc') fontColorInput.value = '#0f172a';
        }
    }

    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if(darkModeToggle) {
        darkModeToggle.checked = prefersDark;
        applyTheme(prefersDark);
        darkModeToggle.addEventListener('change', () => applyTheme(darkModeToggle.checked));
    }

    loadVoices();
    verificarContextoUrl();

    // Deixar como padrão o percentual de 100%
    const summaryPercentInput = document.getElementById('summaryPercent');
    if (summaryPercentInput) {
        summaryPercentInput.value = "100";
    }

    if (leituraIdParam) {
        carregarLeituraFirebasePorUrl(leituraIdParam);
    } else {
        document.getElementById('rawText').value = `O rover Curiosity, da NASA, pousou em Marte em 2012 para investigar o passado geológico do planeta.\n\nA missão do Curiosity é determinar se Marte já teve as condições ambientais necessárias para sustentar vida microbiana.`;
    }
    updateCounters();
    document.getElementById('autoModeSwitch').checked = autoMode;
});

function changeSkin(skinName) {
    document.body.className = document.body.className.replace(/skin-\S+/g, '');
    document.body.classList.add(skinName);
}

function verificarContextoUrl() {
    const statusEl = document.getElementById('statusVinculo');
    if (userIdUrl && topicoIdUrl) {
        statusEl.innerHTML = "✅ Conectado ao usuário e tópico com sucesso!";
        statusEl.style.color = "var(--success-color)";
    } else {
        statusEl.innerHTML = "⚠️ Aberto de forma avulsa (Parâmetros incompletos na URL).";
        statusEl.style.color = "#d97706";
    }
}

// =======================================================
// VARIÁVEIS GLOBAIS DE LEITURA
// =======================================================
let sentences=[], currentIndex=0, autoMode=false, voiceEnabled=true;
let voices=[], selectedVoice=null;
const output=document.getElementById('output');
const voiceSelect=document.getElementById('voiceSelect');
const rawTextArea = document.getElementById('rawText');
const processedTextArea = document.getElementById('processedText');

// Função de blindagem contra palavras coladas
function garantirEspacos(texto) {
    if (!texto) return "";
    return texto
        .replace(/([a-zà-úáéíóúãõâêîôûç])([A-ZÁÉÍÓÚÃÕÂÊÎÔÛÇ])/g, '$1 $2')
        .replace(/([.?!,;:])([^\s0-9])/g, '$1 $2')
        .replace(/\s+/g, ' ')
        .trim();
}

// Função robusta de divisão de sentenças por ponto final, respeitando aspas, parênteses e a regra de "versus" ou "vs."
function sent_tokenize_browser(text) {
    if (!text || !text.trim()) return [];
    
    let cleanText = text.replace(/\b(vs\.?|versus)\b/gi, (match) => {
        return " " + match + " ";
    });

    let tokens = [];
    let current = "";
    let inQuotes = false;
    let parenDepth = 0;
    
    let i = 0;
    while (i < cleanText.length) {
        let char = cleanText[i];
        
        if (char === '.' && cleanText[i+1] === '.' && cleanText[i+2] === '.') {
            current += '...';
            i += 3;
            continue;
        }
        
        if (char === '.' && i >= 2 && (cleanText.substring(i-2, i+1).toLowerCase() === 'vs.' || cleanText.substring(i-3, i+1).toLowerCase() === 'vs.')) {
            current += char;
            i++;
            continue;
        }

        if (char === '"' || char === '“' || char === '”') {
            inQuotes = !inQuotes;
            current += char;
            i++;
            continue;
        }
        
        if (char === '(') {
            parenDepth++;
            current += char;
            i++;
            continue;
        }
        if (char === ')' && parenDepth > 0) {
            parenDepth--;
            current += char;
            i++;
            continue;
        }
        
        if ((char === '.' || char === '!' || char === '?') && !inQuotes && parenDepth === 0) {
            let isVsAbbr = false;
            let precedingText = current.trim().toLowerCase();
            if (char === '.' && (precedingText.endsWith('vs') || precedingText.endsWith('v'))) {
                isVsAbbr = true;
            }

            current += char;

            if (!isVsAbbr) {
                tokens.push(garantirEspacos(current));
                current = "";
                while (i + 1 < cleanText.length && /\s/.test(cleanText[i + 1])) {
                    i++;
                }
            }
        } else {
            current += char;
        }
        i++;
    }
    
    if (current.trim()) {
        tokens.push(garantirEspacos(current));
    }
    
    return tokens.filter(Boolean);
}

function gerarResumo(textoOriginal) {
    const frases = sent_tokenize_browser(textoOriginal.trim());
    const totalFrases = frases.length;
    const percentual = document.getElementById('summaryPercent')?.value || 100;
    let numFrasesDesejadas = Math.max(1, Math.ceil(totalFrases * (percentual / 100)));
    if (totalFrases === 0) return "Texto muito curto.";
    
    let textoResumido = frases.slice(0, numFrasesDesejadas).join('\n\n');
    return garantirEspacos(textoResumido);
}

function loadVoices(){
    const allVoices = speechSynthesis.getVoices();
    if(!voiceSelect) return;
    voiceSelect.innerHTML = ""; 
    voices = allVoices.filter(v => v.lang.startsWith('pt-'));

    let defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = "Automático (Padrão)";
    voiceSelect.appendChild(defaultOption);

    let antonioIndex = -1;

    voices.forEach((v, i) => {
        let o = document.createElement("option");
        o.value = v.name;
        o.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(o);

        // Verifica o nome contendo antonio (ignorando acentos e maiúsculas/minúsculas)
        const nomeVoz = v.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (nomeVoz.includes('antonio') && nomeVoz.includes('natural')) {
            antonioIndex = v.name;
        }
    });

    // Se encontrou a voz do Antônio, define ela como selecionada por padrão
    if (antonioIndex !== -1) {
        selectedVoice = voices.find(v => v.name === antonioIndex);
        voiceSelect.value = antonioIndex;
    } else if(voices.length > 0) { 
        selectedVoice = voices[0]; 
        voiceSelect.value = voices[0].name; 
    }
}
speechSynthesis.onvoiceschanged = loadVoices;
voiceSelect.addEventListener("change", () => {
    const nomeSelecionado = voiceSelect.value;
    selectedVoice = nomeSelecionado === "" ? null : voices.find(v => v.name === nomeSelecionado);
});

function generateSentences(){
    stopReading();
    const text = rawTextArea.value;
    if(!text.trim()) return;
    const resumoText = gerarResumo(text);
    processedTextArea.value = resumoText;
    sentences = resumoText.split(/\n\s*\n/).flatMap(p => sent_tokenize_browser(p)).map(s=>garantirEspacos(s)).filter(Boolean);
    currentIndex = 0;
    showCurrent();
    updateCounters();
}

function syncProcessedText(){
    stopReading();
    let textCorrigido = garantirEspacos(processedTextArea.value);
    processedTextArea.value = textCorrigido;
    sentences = textCorrigido.split(/\n\s*\n/).flatMap(p => sent_tokenize_browser(p)).map(s=>garantirEspacos(s)).filter(Boolean);
    currentIndex = 0;
    showCurrent();
    updateCounters();
}

function clearRawText(){
    stopReading();
    rawTextArea.value = "";
    processedTextArea.value = "";
    sentences = [];
    output.textContent = "Texto apagado.";
    updateCounters();
}

// Funções de Área de Transferência
async function pasteFromClipboard() {
    try {
        if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            rawTextArea.value = garantirEspacos(text);
            updateCounters();
        } else {
            throw new Error("API Clipboard não suportada neste contexto.");
        }
    } catch (err) {
        console.warn('Uso de prompt alternativo para colar:', err);
        const userText = prompt("Cole seu texto aqui (Ctrl+V):");
        if (userText !== null) {
            rawTextArea.value = garantirEspacos(userText);
            updateCounters();
        }
    }
}

async function copyRawText() {
    try {
        await navigator.clipboard.writeText(rawTextArea.value);
        alert("Texto de entrada copiado para a área de transferência!");
    } catch (err) {
        console.error('Erro ao copiar:', err);
        alert("Não foi possível copiar automaticamente.");
    }
}

async function copyProcessedText() {
    try {
        await navigator.clipboard.writeText(processedTextArea.value);
        alert("Prévia do texto copiada para a área de transferência!");
    } catch (err) {
        console.error('Erro ao copiar:', err);
        alert("Não foi possível copiar automaticamente.");
    }
}

async function pasteToProcessedText() {
    try {
        if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            processedTextArea.value = garantirEspacos(text);
            updateCounters();
        } else {
            throw new Error("API Clipboard não suportada.");
        }
    } catch (err) {
        const userText = prompt("Cole o texto na prévia aqui (Ctrl+V):");
        if (userText !== null) {
            processedTextArea.value = garantirEspacos(userText);
            updateCounters();
        }
    }
}

function searchGoogle(){ 
    const q = document.getElementById('searchInput').value.trim(); 
    if(q) window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, "_blank"); 
}

function showCurrent(){
    if(!sentences || !sentences.length){ output.textContent = "Nenhuma frase gerada."; return; }
    output.style.fontSize = (document.getElementById('fontSize')?.value || 24) + "px";
    output.style.color = document.getElementById('fontColor')?.value || '';
    output.style.fontFamily = document.getElementById('fontFamily')?.value || '';
    output.textContent = garantirEspacos(sentences[currentIndex]);
}

function speakCurrent() {
    const text = sentences[currentIndex];
    if (!voiceEnabled || !text || !text.trim()) { if (autoMode) nextSentenceAuto(); return; }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(garantirEspacos(text));
    if (selectedVoice) utter.voice = selectedVoice;
    utter.rate = parseFloat(document.getElementById('voiceRate')?.value) || 1;
    
    utter.onend = () => { if (autoMode) setTimeout(nextSentenceAuto, 250); else document.getElementById('playPauseBtn').textContent = '▶️'; };
    speechSynthesis.speak(utter);
}

function playPauseToggle() {
    if (!sentences.length) { alert("Resuma o texto primeiro!"); return; }
    if (speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); document.getElementById('playPauseBtn').textContent = '▶️'; }
    else if (speechSynthesis.paused) { speechSynthesis.resume(); document.getElementById('playPauseBtn').textContent = '⏸️'; }
    else { if (currentIndex < 0 || currentIndex >= sentences.length) currentIndex = 0; showCurrent(); speakCurrent(); }
}

function stopReading() {
    autoMode = false;
    document.getElementById('autoModeSwitch').checked = false;
    speechSynthesis.cancel();
    document.getElementById('playPauseBtn').textContent = '▶️';
}

function toggleAutoMode() {
    autoMode = document.getElementById('autoModeSwitch').checked;
    if (autoMode && !speechSynthesis.speaking) { showCurrent(); speakCurrent(); }
    else speechSynthesis.cancel();
}

function nextSentenceAuto(){
    if (!sentences.length || !autoMode) { stopReading(); return; }
    currentIndex = (currentIndex + 1) % sentences.length;
    showCurrent();
    speakCurrent();
}

function nextSentence(){ if (!sentences.length) return; stopReading(); currentIndex = (currentIndex + 1) % sentences.length; showCurrent(); if(voiceEnabled) speakCurrent(); }
function prevSentence(){ if (!sentences.length) return; stopReading(); currentIndex = (currentIndex - 1 + sentences.length) % sentences.length; showCurrent(); if(voiceEnabled) speakCurrent(); }
function toggleVoice(){ voiceEnabled = !voiceEnabled; document.getElementById('voiceToggleBtn').textContent = voiceEnabled ? '🗣️' : '🔇'; if (!voiceEnabled) speechSynthesis.cancel(); }

function exportJSON(){ 
    const data = { sentences }; 
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); 
    const url = URL.createObjectURL(blob); 
    const a = document.createElement('a'); a.href = url; a.download = 'leitura_guiada.json'; a.click(); 
}

function importJSON(event){ 
    const file = event.target.files[0]; 
    if(!file) return; 
    const reader = new FileReader(); 
    reader.onload = (e) => { 
        try { 
            const data = JSON.parse(e.target.result); 
            if(data.sentences) sentences = data.sentences.map(s => garantirEspacos(s)); 
            processedTextArea.value = sentences.join("\n\n"); 
            showCurrent(); alert("Importado com sucesso!"); 
        } catch(err) { alert("Erro: " + err); } 
    }; 
    reader.readAsText(file); 
}

// ===============================================
// SALVAMENTO AUTOMATIZADO VIA PONTE (FIRESTORE)
// ===============================================
async function salvarVinculoFirebase() {
    if (!userIdUrl || !topicoIdUrl) {
        alert("Erro: Parâmetros do usuário ou tópico ausentes na URL.");
        return;
    }

    if (!sentences || !sentences.length) {
        alert("Resuma ou processe o texto antes de salvar!");
        return;
    }

    const rotulo = document.getElementById('rotuloLinkInput').value.trim() || "Leitura Guiada";

    try {
        const leituraRef = await firebase.firestore().collection('leituras_guiadas').add({
            rawText: rawTextArea.value,
            processedText: processedTextArea.value,
            sentences: sentences,
            criadoEm: new Date().toISOString()
        });
        
        const leituraId = leituraRef.id;
        const urlAcesso = `${window.location.origin}${window.location.pathname}?id=${leituraId}`;

        const userDocRef = firebase.firestore().collection('users').doc(userIdUrl);
        
        const novoLink = {
            id: leituraId,
            title: rotulo,
            url: urlAcesso,
            tipo: 'Web',
            criadoEm: new Date().toISOString()
        };

        const userSnap = await userDocRef.get();
        let updateData = {};

        if (userSnap.exists) {
            const userData = userSnap.data();
            const studyPlan = userData.studyPlan || {};
            
            if (studyPlan[topicoIdUrl]) {
                if (!studyPlan[topicoIdUrl].links) {
                    studyPlan[topicoIdUrl].links = [];
                }
                studyPlan[topicoIdUrl].links.push(novoLink);
            } else {
                studyPlan[topicoIdUrl] = {
                    links: [novoLink]
                };
            }
            updateData.studyPlan = studyPlan;
        } else {
            updateData.studyPlan = {
                [topicoIdUrl]: {
                    links: [novoLink]
                }
            };
        }

        await userDocRef.set(updateData, { merge: true });

        alert("Link salvo com sucesso e integrado ao seu perfil no Alumno!");
        
    } catch (error) {
        console.error("Erro ao salvar no Firestore:", error.code, error.message);
        alert("Erro ao salvar: " + error.message);
    }
}

async function carregarLeituraFirebasePorUrl(id) {
    try {
        const docRef = await firebase.firestore().collection('leituras_guiadas').doc(id).get();
        if (docRef.exists) {
            const data = docRef.data();
            if (data && data.sentences) {
                sentences = data.sentences.map(s => garantirEspacos(s));
                currentIndex = 0;
                if (data.rawText) rawTextArea.value = garantirEspacos(data.rawText);
                if (data.processedText) processedTextArea.value = garantirEspacos(data.processedText);
                showCurrent();
                updateCounters();
            }
        }
    } catch(err) {
        console.error("Erro ao carregar leitura do Firestore:", err);
    }
}

// =======================================================
// MÓDULO APARAR TEXTO
// =======================================================
function openManualEditor() {
    const editorList = document.getElementById('editor-list');
    const text = rawTextArea.value;
    if (!text.trim()) { alert('A caixa de entrada de texto está vazia.'); return; }
    
    const frasesAparadas = sent_tokenize_browser(text);
    
    editorList.innerHTML = '';
    
    frasesAparadas.forEach(frase => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'editor-item';
        itemDiv.innerHTML = `<p contenteditable="true">${garantirEspacos(frase)}</p><button class="secondary" onclick="this.parentElement.remove()" style="border-radius:50%; width:24px; height:24px; padding:0; font-size:11px;" title="Remover trecho">&times;</button>`;
        editorList.appendChild(itemDiv);
    });
    document.getElementById('manual-editor-modal').style.display = 'flex';
}

function closeManualEditor() { document.getElementById('manual-editor-modal').style.display = 'none'; }

function saveManualChanges() {
    const items = document.querySelectorAll('#editor-list p');
    let newText = [];
    items.forEach(item => { 
        let textoLimpo = garantirEspacos(item.textContent);
        if (textoLimpo) newText.push(textoLimpo); 
    });
    
    const combinedText = newText.join('\n\n');
    rawTextArea.value = combinedText;
    processedTextArea.value = combinedText;
    sentences = newText.map(s => garantirEspacos(s)).filter(Boolean);
    currentIndex = 0;
    
    closeManualEditor();
    showCurrent();
    updateCounters();
}

function updateCounters() {
    const rawText = rawTextArea.value;
    const processedText = processedTextArea.value;
    document.getElementById('rawTextCounter').textContent = `(${rawText.length} carac.)`;
    document.getElementById('processedTextCounter').textContent = `(${processedText.length} carac.)`;
}
